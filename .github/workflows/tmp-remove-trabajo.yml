name: Remove Nuestro trabajo
on:
  push:
    branches: [remove-trabajo-final]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar pestaña Nuestro trabajo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text()
          s=s.replace('''                    <button class="pestana" type="button" data-seccion-panel="trabajo">\n                        📸 Nuestro trabajo <span id="contador-trabajo-pestana">0</span>\n                    </button>\n''','')
          s=s.replace('''                                        <option value="trabajo">📸 Nuestro trabajo</option>\n''','')
          p.write_text(s)
          p=Path('admin/admin.js')
          s=p.read_text()
          s=s.replace('''    const mostrarContenido = ["carrusel", "blog", "trabajo"].includes(seccion);''','''    const mostrarContenido = ["carrusel", "blog"].includes(seccion);''')
          s=s.replace('''        trabajo: { titulo: "Nuestro trabajo", descripcion: "Administra las fotos y videos de la sección Nuestro trabajo.", formulario: "Publicar en Nuestro trabajo" }\n''','')
          s=s.replace('''    destinoContenidoActual = ["carrusel", "blog", "trabajo"].includes(destino) ? destino : "carrusel";''','''    destinoContenidoActual = ["carrusel", "blog"].includes(destino) ? destino : "carrusel";''')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html admin/admin.js
          git commit -m "Quitar Nuestro trabajo del panel"
          git push
