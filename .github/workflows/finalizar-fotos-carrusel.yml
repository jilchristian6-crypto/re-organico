name: Finalizar fotos carrusel

on:
  push:
    paths:
      - '.github/workflows/finalizar-fotos-carrusel.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar referencias
        run: python3 .github/scripts/agregar-fotos-carrusel.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/agregar-fotos-carrusel.py .github/workflows/finalizar-fotos-carrusel.yml
          git add -A
          git commit -m "Conectar fotos reales al carrusel principal"
          git push
