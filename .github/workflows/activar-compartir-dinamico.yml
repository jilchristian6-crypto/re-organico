name: Activar compartir dinamico de productos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activar-compartir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Agregar script de compartir dinamico
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          texto = path.read_text(encoding='utf-8')
          marcador = '<script src="compartir-productos.js?v=20260914"></script>'

          if marcador in texto:
              print('El script de compartir dinamico ya esta instalado.')
              raise SystemExit(0)

          ancla = '<script src="script.js?v=20260913-v4"></script>'
          if ancla not in texto:
              raise SystemExit('No se encontro el script publico principal en index.html')

          texto = texto.replace(ancla, ancla + '\n    ' + marcador, 1)
          path.write_text(texto, encoding='utf-8')
          print('Script de compartir dinamico agregado a index.html')
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi
          git commit -m "fix: cargar compartir dinamico de productos"
          git push
