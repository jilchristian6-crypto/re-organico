name: Activar enlaces directos de productos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activar-enlaces:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Agregar funcionalidad de enlaces directos
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('script.js')
          texto = path.read_text(encoding='utf-8')
          marcador = '/* Re Orgánico: enlaces directos por producto */'

          if marcador in texto:
              print('La funcionalidad ya estaba instalada.')
          else:
              codigo = r'''/* Re Orgánico: enlaces directos por producto */
          (() => {
              const PARAMETRO_PRODUCTO = "producto";
              const CLASE_ENLACE = "enlace-producto-directo";
              let ultimoProductoAbierto = null;

              function obtenerIdDesdeUrl() {
                  try {
                      return new URL(window.location.href).searchParams.get(PARAMETRO_PRODUCTO);
                  } catch (error) {
                      return null;
                  }
              }

              function crearUrlProducto(id) {
                  const url = new URL(window.location.href);
                  url.searchParams.set(PARAMETRO_PRODUCTO, id);
                  url.hash = "productos";
                  return url.toString();
              }

              function agregarEnlacesProducto() {
                  document.querySelectorAll("article.producto[data-id]").forEach((tarjeta) => {
                      const id = tarjeta.dataset.id;
                      if (!id || tarjeta.querySelector(`.${CLASE_ENLACE}`)) return;

                      const enlace = document.createElement("a");
                      enlace.className = CLASE_ENLACE;
                      enlace.href = crearUrlProducto(id);
                      enlace.textContent = "🔗 Ver producto";
                      enlace.setAttribute("aria-label", "Abrir producto y obtener su enlace directo");

                      const acciones = tarjeta.querySelector(".producto-acciones") || tarjeta;
                      acciones.append(enlace);
                  });
              }

              function buscarBotonProducto(id) {
                  if (!id) return null;
                  const botones = document.querySelectorAll('[data-accion="detalle"][data-id]');
                  let encontrado = null;
                  botones.forEach((boton) => {
                      if (!encontrado && boton.dataset.id === id) encontrado = boton;
                  });
                  return encontrado;
              }

              function abrirProductoDesdeUrl() {
                  const id = obtenerIdDesdeUrl();
                  if (!id || id === ultimoProductoAbierto) return false;

                  const boton = buscarBotonProducto(id);
                  if (!boton) return false;

                  ultimoProductoAbierto = id;
                  boton.click();
                  setTimeout(() => {
                      const modal = document.getElementById("modal-producto");
                      if (modal) modal.scrollIntoView({ behavior: "smooth", block: "center" });
                  }, 150);
                  return true;
              }

              function actualizarUrlAlAbrirProducto() {
                  document.addEventListener("click", (evento) => {
                      const boton = evento.target.closest('[data-accion="detalle"][data-id]');
                      if (!boton) return;
                      const id = boton.dataset.id;
                      if (!id) return;
                      const url = new URL(window.location.href);
                      url.searchParams.set(PARAMETRO_PRODUCTO, id);
                      url.hash = "productos";
                      history.replaceState({ producto: id }, "", url.toString());
                      ultimoProductoAbierto = id;
                  }, true);
              }

              function iniciarEnlacesProducto() {
                  agregarEnlacesProducto();
                  actualizarUrlAlAbrirProducto();
                  abrirProductoDesdeUrl();

                  const observador = new MutationObserver(() => {
                      agregarEnlacesProducto();
                      abrirProductoDesdeUrl();
                  });
                  observador.observe(document.body, { childList: true, subtree: true });

                  let intentos = 0;
                  const reintento = setInterval(() => {
                      intentos += 1;
                      agregarEnlacesProducto();
                      if (abrirProductoDesdeUrl() || intentos >= 40) clearInterval(reintento);
                  }, 500);
              }

              if (document.readyState === "loading") {
                  document.addEventListener("DOMContentLoaded", iniciarEnlacesProducto, { once: true });
              } else {
                  iniciarEnlacesProducto();
              }
          })();
          '''

              codigo = '\n'.join(line[10:] if line.startswith('          ') else line for line in codigo.splitlines())
              path.write_text(texto.rstrip() + '\n\n' + codigo.strip() + '\n', encoding='utf-8')
              print('Funcionalidad agregada a script.js')

          # Siempre agregamos una segunda capa de apertura robusta. Esta evita
          # depender del momento exacto en que el catálogo termina de renderizar.
          marcador2 = '/* Re Orgánico: apertura robusta de producto desde URL v2 */'
          if marcador2 not in texto:
              texto = path.read_text(encoding='utf-8')
              robusto = r'''/* Re Orgánico: apertura robusta de producto desde URL v2 */
          (() => {
              const PARAMETRO = "producto";
              let abierto = null;

              function idProducto() {
                  try { return new URL(window.location.href).searchParams.get(PARAMETRO); }
                  catch (_) { return null; }
              }

              function intentarAbrir() {
                  const id = idProducto();
                  if (!id || id === abierto) return false;

                  const botones = document.querySelectorAll('[data-accion="detalle"][data-id]');
                  let boton = null;
                  botones.forEach((item) => {
                      if (!boton && item.dataset.id === id) boton = item;
                  });

                  if (!boton) return false;

                  abierto = id;
                  boton.click();
                  setTimeout(() => {
                      const modal = document.getElementById("modal-producto");
                      if (modal) modal.scrollIntoView({ behavior: "smooth", block: "center" });
                  }, 200);
                  return true;
              }

              function iniciar() {
                  intentarAbrir();
                  const observador = new MutationObserver(intentarAbrir);
                  observador.observe(document.body, { childList: true, subtree: true });

                  let intentos = 0;
                  const temporizador = setInterval(() => {
                      intentos += 1;
                      if (intentarAbrir() || intentos >= 60) clearInterval(temporizador);
                  }, 500);
              }

              if (document.readyState === "loading") {
                  document.addEventListener("DOMContentLoaded", iniciar, { once: true });
              } else {
                  iniciar();
              }
          })();
          '''
              robusto = '\n'.join(line[10:] if line.startswith('          ') else line for line in robusto.splitlines())
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n\n' + robusto.strip() + '\n', encoding='utf-8')
              print('Capa robusta v2 agregada a script.js')
          else:
              print('La capa robusta v2 ya estaba instalada.')
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi
          git commit -m "fix: abrir productos enlazados de forma robusta"
          git push
