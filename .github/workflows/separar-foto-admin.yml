name: Separar foto del panel de administración

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  separar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Separar imagen administrativa de la imagen pública
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('admin/admin.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('presentaciones,imagen_path")', 'presentaciones,imagen_path,imagen_admin_path")')
          s = s.replace('obtenerUrlPublicaProducto(producto.imagen_path)', 'obtenerUrlPublicaProducto(producto.imagen_admin_path || producto.imagen_path)')
          s = s.replace('${producto.imagen_path ? "Cambiar foto" : "Agregar foto"}', '${producto.imagen_admin_path ? "Cambiar foto" : "Agregar foto"}')
          s = s.replace('.update({ imagen_path: nuevoPath })', '.update({ imagen_admin_path: nuevoPath })')
          s = s.replace('const pathAnterior = producto.imagen_path;\n            producto.imagen_path = nuevoPath;', 'const pathAnterior = producto.imagen_admin_path;\n            producto.imagen_admin_path = nuevoPath;')
          p.write_text(s, encoding='utf-8')

          g = Path('admin/galeria-productos.js')
          if g.exists():
              s = g.read_text(encoding='utf-8')
              s = s.replace('select("imagen_path")', 'select("imagen_path,imagen_admin_path")')
              s = s.replace('p?.imagen_path||""', 'p?.imagen_admin_path||p?.imagen_path||""')
              s = s.replace('!p?.imagen_path', '!p?.imagen_admin_path')
              s = s.replace('.update({imagen_path:path})', '.update({imagen_admin_path:path})')
              s = s.replace('p?.imagen_path===v.path', 'p?.imagen_admin_path===v.path')
              s = s.replace('.update({imagen_path:next?.path||null})', '.update({imagen_admin_path:next?.path||null})')
              g.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/admin.js admin/galeria-productos.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: foto administrativa independiente de la foto publica"
          git push
