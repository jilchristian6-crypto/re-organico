<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Re Orgánico</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fbfaf5}
    body{display:grid;place-items:center;font-family:Arial,sans-serif;color:#1f4d3a}
    .cargando{padding:24px;text-align:center}
  </style>
</head>
<body>
  <div class="cargando">Cargando Re Orgánico…</div>
  <script>
    (async function () {
      try {
        const ruta = new URL(window.location.href);
        const partes = ruta.pathname.split('/').filter(Boolean);
        const indiceProducto = partes.indexOf('producto');
        const idProducto = indiceProducto !== -1 && partes[indiceProducto + 1]
          ? decodeURIComponent(partes[indiceProducto + 1]).trim()
          : ruta.searchParams.get('producto');

        if (idProducto) {
          const query = new URLSearchParams();
          query.set('producto', idProducto);
          history.replaceState({}, '', '/?' + query.toString());
        }

        const respuesta = await fetch('/index.html?form-fix=producto', {
          cache: 'no-store',
          credentials: 'same-origin'
        });

        if (!respuesta.ok) throw new Error('No se pudo cargar la página principal.');

        let html = await respuesta.text();

        // El HTML principal usa rutas relativas (style.css, assets/..., etc.).
        // Al entrar directamente por /producto/ID, esas rutas pueden resolverse
        // desde /producto/ y provocar una página sin estilos. Las convertimos
        // explícitamente a rutas absolutas antes de insertar el HTML.
        const parser = new DOMParser();
        const documento = parser.parseFromString(html, 'text/html');
        const elementos = documento.querySelectorAll(
          'link[href], script[src], img[src], source[src], video[src], audio[src], iframe[src], object[data], embed[src], track[src]'
        );

        elementos.forEach((elemento) => {
          const atributo = elemento.hasAttribute('href')
            ? 'href'
            : elemento.hasAttribute('src')
              ? 'src'
              : elemento.hasAttribute('data')
                ? 'data'
                : null;

          if (!atributo) return;

          const valor = elemento.getAttribute(atributo);
          if (!valor) return;

          const limpio = valor.trim();
          if (
            limpio.startsWith('/') ||
            limpio.startsWith('#') ||
            limpio.startsWith('?') ||
            limpio.startsWith('http://') ||
            limpio.startsWith('https://') ||
            limpio.startsWith('//') ||
            limpio.startsWith('data:') ||
            limpio.startsWith('blob:') ||
            limpio.startsWith('mailto:') ||
            limpio.startsWith('tel:') ||
            limpio.startsWith('javascript:')
          ) return;

          elemento.setAttribute(atributo, '/' + limpio.replace(/^\.\//, ''));
        });

        html = '<!DOCTYPE html>\n' + documento.documentElement.outerHTML;

        const scriptTurnstile = '<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer>' + '</' + 'script>';
        const scriptProducto = '<script src="/producto-directo.js?v=20260919"></' + 'script>';

        if (!html.includes('https://challenges.cloudflare.com/turnstile/v0/api.js')) {
          html = html.replace('</head>', scriptTurnstile + '</head>');
        }

        if (!html.includes('/producto-directo.js')) {
          html = html.replace('</body>', scriptProducto + '</body>');
        }

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.body.innerHTML = '<div class="cargando"><strong>No se pudo cargar Re Orgánico.</strong><br>Recarga la página e inténtalo nuevamente.</div>';
      }
    })();
  </script>
</body>
</html>
