name: Corregir miniaturas vermicompostera

on:
  push:
    paths:
      - '.github/workflows/fix-vermicompostera-thumbnails.yml'

permissions:
  contents: write

jobs:
  fix-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Corregir carga de miniaturas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase-config.js')
          text = path.read_text(encoding='utf-8')

          old = 'const img = document.createElement("img"); img.src = ruta; img.alt = ""; img.loading = "lazy";'
          new = 'const img = document.createElement("img"); img.src = ruta; img.alt = ""; img.loading = "eager"; img.decoding = "async";'
          if old not in text:
              raise SystemExit('No se encontró la línea de miniaturas esperada')
          text = text.replace(old, new, 1)

          old_css = '.galeria-producto-miniatura img{width:100%;height:100%;object-fit:cover}'
          new_css = '.galeria-producto-miniatura img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}'
          if old_css in text:
              text = text.replace(old_css, new_css, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js
          git commit -m "Corrige miniaturas de vermicompostera"
          git push
