name: Actualizar Link de Producto

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar botón, activar copia y cargar galería admin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('enlace.textContent = "🔗 Ver producto";', 'enlace.textContent = "🔗 Link de Producto";')
          # No interceptamos el clic del enlace: debe navegar a /producto/:id.
          admin = Path('admin/index.html')
          a = admin.read_text(encoding='utf-8')
          tag = '<script src="/admin/galeria-productos.js"></script>'
          if tag not in a:
              marker_admin = '<script src="/admin/admin.js"></script>'
              if marker_admin not in a:
                  raise SystemExit('No se encontró admin.js en admin/index.html')
              a = a.replace(marker_admin, marker_admin + '\n    ' + tag, 1)
          css_tag = '<link rel="stylesheet" href="/admin/galeria-productos.css">'
          if css_tag not in a:
              marker_css = '<link rel="stylesheet" href="/admin/admin.css">'
              if marker_css not in a:
                  raise SystemExit('No se encontró admin.css en admin/index.html')
              a = a.replace(marker_css, marker_css + '\n    ' + css_tag, 1)
          admin.write_text(a, encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js admin/index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: cargar galeria de fotos por producto en admin"
          git push
