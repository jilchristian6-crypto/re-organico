        .hero-portada-nueva .beneficios-nuevos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;max-width:620px;margin-top:48px}.hero-portada-nueva .beneficio-nuevo{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:0;border:0;background:transparent}.hero-portada-nueva .beneficio-icono-nuevo{width:70px;height:70px;display:grid;place-items:center;margin-bottom:14px;border-radius:50%;background:rgba(222,238,221,.85)}.hero-portada-nueva .beneficio-icono-nuevo svg{width:38px;height:38px;fill:none;stroke:#65a669;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hero-portada-nueva .beneficio-nuevo strong{color:#287f34;font-size:15px;text-transform:uppercase}.hero-portada-nueva .beneficio-nuevo span{max-width:150px;margin-top:8px;color:#666965;font-size:12px;line-height:1.45}

        .hero-portada-nueva .hero-carrusel-control{position:absolute;z-index:4;top:50%;width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.82);border-radius:50%;background:rgba(31,77,58,.78);color:#fff;font-size:28px;line-height:1;box-shadow:0 10px 24px rgba(0,0,0,.2);backdrop-filter:blur(8px);transform:translateY(-50%);cursor:pointer;transition:.25s ease}.hero-portada-nueva .hero-carrusel-control:hover,.hero-portada-nueva .hero-carrusel-control:focus-visible{background:#278b34;transform:translateY(-50%) scale(1.08)}.hero-portada-nueva .hero-carrusel-anterior{left:16px}.hero-portada-nueva .hero-carrusel-siguiente{right:16px}.hero-portada-nueva .hero-carrusel-indicadores{position:absolute;z-index:4;left:50%;bottom:18px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;background:rgba(20,53,38,.72);backdrop-filter:blur(8px);transform:translateX(-50%)}.hero-portada-nueva .hero-carrusel-indicador{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer;transition:.25s ease}.hero-portada-nueva .hero-carrusel-indicador[aria-current="true"]{width:25px;border-radius:99px;background:#fff}.hero-carrusel-estado{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
