name: Aplicar ajustes catalogo

on:
  push:
    paths:
      - '.github/workflows/aplicar-ajustes-catalogo.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambios
        run: python3 .github/scripts/aplicar-ajustes.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/aplicar-ajustes.py .github/workflows/aplicar-ajustes-catalogo.yml
          git add -A
          git commit -m "Ocultar admin, quitar vaso 470 cc y limpiar texto repetido"
          git push
