# Ejecución 2
name: Corregir logo de WhatsApp

on:
  push:
    paths:
      - '.github/workflows/fix-whatsapp-logo.yml'

permissions:
  contents: write

jobs:
  fix-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Reemplazar solo el logo de WhatsApp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('supabase-config.js')
          text = path.read_text(encoding='utf-8')

          nuevo = r'''const iconoWhatsApp = `
      <svg class="icono-red icono-whatsapp" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="15" fill="#25D366"/>
        <path fill="#fff" d="M23.1 8.72A9.88 9.88 0 0 0 15.99 5.8c-5.45 0-9.88 4.3-9.88 9.59 0 1.69.45 3.34 1.31 4.79L6.02 25.3l5.38-1.37a10.13 10.13 0 0 0 4.58 1.07h.01c5.45 0 9.88-4.3 9.88-9.59a9.44 9.44 0 0 0-2.77-6.69Zm-7.11 14.66h-.01a8.42 8.42 0 0 1-4.29-1.15l-.31-.18-3.19.81.85-3.02-.2-.31a7.88 7.88 0 0 1-1.25-4.14c0-4.41 3.69-8 8.41-8 2.24 0 4.35.85 5.93 2.39a7.85 7.85 0 0 1 2.46 5.63c-.01 4.39-3.7 7.97-8.4 7.97Zm4.61-5.98c-.25-.12-1.5-.72-1.73-.8-.23-.08-.4-.12-.57.12-.17.24-.65.8-.8.96-.15.16-.3.18-.55.06-.25-.12-1.06-.38-2.02-1.2-.75-.64-1.25-1.43-1.4-1.67-.15-.24-.02-.37.11-.49.11-.11.25-.28.38-.42.12-.14.16-.24.25-.41.08-.16.04-.31-.02-.43-.06-.12-.57-1.32-.78-1.81-.2-.47-.41-.41-.57-.42h-.48c-.17 0-.44.06-.67.31-.23.24-.88.84-.88 2.05s.9 2.38 1.02 2.54c.13.16 1.77 2.62 4.29 3.67.6.25 1.07.4 1.44.51.6.19 1.15.16 1.58.1.48-.07 1.5-.6 1.71-1.18.21-.58.21-1.08.15-1.18-.06-.1-.23-.16-.48-.28Z"/>
      </svg>`;'''

          patron = r'const iconoWhatsApp = `.*?`;(?=\n\n    function aplicarAjustesJefa)'
          text2, n = re.subn(patron, nuevo, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'No se encontró un único bloque iconoWhatsApp (encontrados: {n})')

          path.write_text(text2, encoding='utf-8')
          PY

      - name: Guardar cambio
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hubo cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js
          git commit -m "Arregla logo de WhatsApp"
          git push
