name: Activar fotos directas por producto

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Agregar script al panel admin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '    <script src="/admin/fotos-por-producto.js?v=1"></script>'
          if tag not in s:
              marker = '    <script src="/admin/galeria-productos.js"></script>'
              if marker not in s:
                  raise SystemExit('No se encontró el punto de inserción del panel de fotos.')
              s = s.replace(marker, marker + '\n' + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Activar carga directa de fotos por producto"
          git push
