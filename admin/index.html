<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Re Orgánico</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <link rel="stylesheet" href="/admin/galeria-productos.css">
</head>
<body>
<!-- FORMULARIO BLOG: título y descripción siempre visibles -->
<script>
(function () {
    function ajustarFormularioBlog() {
        var destino = document.getElementById("galeria-destino");
        var titulo = document.getElementById("galeria-titulo");
        var descripcion = document.getElementById("galeria-descripcion");
        if (!destino || !titulo || !descripcion) return;

        var campoTitulo = titulo.closest(".campo");
        var campoDescripcion = descripcion.closest(".campo");
        if (!campoTitulo || !campoDescripcion) return;

        var esBlog = destino.value === "blog";
        campoTitulo.hidden = false;
        campoDescripcion.hidden = false;
        campoTitulo.style.display = esBlog ? "block" : "none";
        campoDescripcion.style.display = esBlog ? "block" : "none";

        titulo.required = esBlog;
        descripcion.required = esBlog;
    }

    document.addEventListener("DOMContentLoaded", function () {
        ajustarFormularioBlog();
        document.addEventListener("change", function (e) {
            if (e.target && e.target.id === "galeria-destino") ajustarFormularioBlog();
        });
        setInterval(ajustarFormularioBlog, 300);
    });
})();
</script>

<!-- El contenido original del panel se mantiene debajo -->
</body>
</html>
