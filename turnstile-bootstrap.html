<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Re Orgánico</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fbfaf5}
    body{display:grid;place-items:center;font-family:Arial,sans-serif;color:#1f4d3a}
    .cargando{padding:24px;text-align:center}
  </style>
</head>
<body>
  <div class="cargando">Cargando Re Orgánico…</div>
  <script>
    (async function () {
      try {
        // Si entramos por /producto/ID, normalizamos temporalmente la ruta a la raíz
        // antes de insertar el HTML. Así todos los recursos relativos (CSS, JS,
        // imágenes, etc.) se resuelven desde / y no desde /producto/.
        const ruta = new URL(window.location.href);
        const partes = ruta.pathname.split('/').filter(Boolean);
        const indiceProducto = partes.indexOf('producto');
        const idProducto = indiceProducto !== -1 && partes[indiceProducto + 1]
          ? decodeURIComponent(partes[indiceProducto + 1]).trim()
          : null;

        if (idProducto) {
          const query = new URLSearchParams();
          query.set('producto', idProducto);
          history.replaceState({}, '', '/?' + query.toString());
        }

        const respuesta = await fetch('/index.html?form-fix=1', {
          cache: 'no-store',
          credentials: 'same-origin'
        });

        if (!respuesta.ok) throw new Error('No se pudo cargar la página principal.');

        let html = await respuesta.text();
        const scriptTurnstile = '<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer>' + '</' + 'script>';
        const scriptProducto = '<script src="/producto-directo.js?v=20260918"></' + 'script>';

        if (!html.includes('https://challenges.cloudflare.com/turnstile/v0/api.js')) {
          html = html.replace('</head>', scriptTurnstile + '</head>');
        }

        if (!html.includes('/producto-directo.js')) {
          html = html.replace('</body>', scriptProducto + '</body>');
        }

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.body.innerHTML = '<div class="cargando"><strong>No se pudo cargar Re Orgánico.</strong><br>Recarga la página e inténtalo nuevamente.</div>';
      }
    })();
  </script>
</body>
</html>
