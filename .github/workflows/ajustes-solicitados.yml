name: Aplicar ajustes solicitados

on:
  push:
    paths:
      - '.github/workflows/ajustes-solicitados.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar cambios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Ocultar acceso administrador del menú público.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'\s*<a\b[^>]*>\s*(?:🔒\s*)?Acceso Administrador\s*</a>',
              '',
              s,
              flags=re.I
          )
          p.write_text(s, encoding='utf-8')

          # 2) Limpiar información repetida y ocultar el vaso blanco 470 cc
          #    desde el catálogo público, sin afectar el panel administrador.
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')

          marker = '/* AJUSTES SOLICITADOS 2026-08-28 */'
          if marker not in s:
              s += r'''

/* AJUSTES SOLICITADOS 2026-08-28 */
(function () {
    "use strict";

    const PRODUCTO_OCULTO = /Vaso\s+Papel\s+Blanco\s*\+\s*PLA.*?(?:16\s*Oz|470\s*Cc)/i;
    const TEXTO_REPETIDO = /^(?:1\s*(?:Pack|Caja|Rollo)\s*:.*Precio\s+Por|Cantidad\s+De\s+(?:Packs|Cajas|Rollos))/i;

    function limpiarCatalogoSolicitado() {
        // Oculta la tarjeta del producto 470 cc si viene desde Supabase o respaldo local.
        document.querySelectorAll('article, .producto, .producto-card, .tarjeta-producto, .product-card, [data-producto-id], [data-id-producto]').forEach((el) => {
            if (PRODUCTO_OCULTO.test((el.textContent || '').replace(/\s+/g, ' '))) {
                el.remove();
            }
        });

        // Quita únicamente el bloque redundante bajo las opciones de presentación.
        document.querySelectorAll('#modal-producto p, #modal-producto div, #modal-producto span, #modal-producto strong').forEach((el) => {
            const texto = (el.textContent || '').replace(/\s+/g, ' ').trim();
            if (!texto) return;
            if (TEXTO_REPETIDO.test(texto) && el.children.length === 0) {
                el.style.display = 'none';
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', limpiarCatalogoSolicitado, { once: true });
    } else {
        limpiarCatalogoSolicitado();
    }

    const observador = new MutationObserver(() => limpiarCatalogoSolicitado());
    observador.observe(document.documentElement, { childList: true, subtree: true });
})();
'''

          p.write_text(s, encoding='utf-8')

          # El workflow es de un solo uso.
          Path('.github/workflows/ajustes-solicitados.yml').unlink(missing_ok=True)
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js .github/workflows/ajustes-solicitados.yml
          git commit -m "Ocultar admin, quitar producto 470 cc y limpiar texto repetido" || exit 0
          git push
