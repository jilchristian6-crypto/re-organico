name: Agregar logos reales de redes

on:
  push:
    paths:
      - '.github/workflows/add-social-logos.yml'

permissions:
  contents: write

jobs:
  add-social-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Agregar logos reales de Instagram y WhatsApp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('supabase-config.js')
          text = path.read_text(encoding='utf-8')
          marker = '/* REORGANICO_LOGOS_REDES_20260824 */'
          if marker in text:
              raise SystemExit(0)

          b64 = ''
          block = base64.b64decode(b64).decode('utf-8')
          path.write_text(text + '\n' + block, encoding='utf-8')
          PY

      - name: Guardar cambio
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hubo cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js
          git commit -m "Usa logos reales de Instagram y WhatsApp"
          git push
