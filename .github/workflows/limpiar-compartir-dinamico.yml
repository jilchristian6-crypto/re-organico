name: Limpiar script temporal de compartir

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar referencia al script temporal
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marcador = '    <script src="compartir-productos.js?v=20260914"></script>\n'
          if marcador in s:
              s = s.replace(marcador, '', 1)
              p.write_text(s, encoding='utf-8')
              print('Referencia eliminada.')
          else:
              print('No habia referencia que eliminar.')
          PY
      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: quitar referencia a script temporal"
          git push
