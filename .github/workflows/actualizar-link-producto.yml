name: Actualizar Link de Producto

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar botón, activar copia y cargar galería admin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('enlace.textContent = "🔗 Ver producto";', 'enlace.textContent = "🔗 Link de Producto";')
          marker = '/* Re Orgánico: copiar link de producto al hacer clic */'
          if marker not in s:
              block = r'''

          /* Re Orgánico: copiar link de producto al hacer clic */
          (() => {
              const CLASE = '.enlace-producto-directo';

              function activarCopia() {
                  document.querySelectorAll(CLASE).forEach((enlace) => {
                      if (enlace.dataset.copiaActivada === '1') return;
                      enlace.dataset.copiaActivada = '1';
                      enlace.addEventListener('click', async (evento) => {
                          evento.preventDefault();
                          const url = enlace.href;
                          const textoOriginal = '🔗 Link de Producto';
                          try {
                              await navigator.clipboard.writeText(url);
                              enlace.textContent = '✓ Link copiado';
                          } catch (error) {
                              const auxiliar = document.createElement('textarea');
                              auxiliar.value = url;
                              auxiliar.style.position = 'fixed';
                              auxiliar.style.opacity = '0';
                              document.body.appendChild(auxiliar);
                              auxiliar.select();
                              document.execCommand('copy');
                              auxiliar.remove();
                              enlace.textContent = '✓ Link copiado';
                          }
                          setTimeout(() => {
                              enlace.textContent = textoOriginal;
                          }, 1800);
                      });
                  });
              }

              const iniciar = () => {
                  activarCopia();
                  const catalogo = document.getElementById('lista-productos');
                  if (catalogo) {
                      new MutationObserver(activarCopia).observe(catalogo, { childList: true, subtree: true });
                  }
              };

              if (document.readyState === 'loading') {
                  document.addEventListener('DOMContentLoaded', iniciar, { once: true });
              } else {
                  iniciar();
              }
          })();
          '''
              p.write_text(s + block, encoding='utf-8')
          else:
              p.write_text(s, encoding='utf-8')

          admin = Path('admin/index.html')
          a = admin.read_text(encoding='utf-8')
          tag = '<script src="/admin/galeria-productos.js"></script>'
          if tag not in a:
              marker_admin = '<script src="/admin/admin.js"></script>'
              if marker_admin not in a:
                  raise SystemExit('No se encontró admin.js en admin/index.html')
              a = a.replace(marker_admin, marker_admin + '\n    ' + tag, 1)
          css_tag = '<link rel="stylesheet" href="/admin/galeria-productos.css">'
          if css_tag not in a:
              marker_css = '<link rel="stylesheet" href="/admin/admin.css">'
              if marker_css not in a:
                  raise SystemExit('No se encontró admin.css en admin/index.html')
              a = a.replace(marker_css, marker_css + '\n    ' + css_tag, 1)
          admin.write_text(a, encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js admin/index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: cargar galeria de fotos por producto en admin"
          git push
