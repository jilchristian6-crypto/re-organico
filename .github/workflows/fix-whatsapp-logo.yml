# Actualización FAQ bolsas
name: Actualizar FAQ bolsas

on:
  push:
    paths:
      - '.github/workflows/fix-whatsapp-logo.yml'

permissions:
  contents: write

jobs:
  actualizar-faq:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar respuesta de bolsas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          anterior = 'Cuando un producto se vende por pack, 1 pack contiene 100 bolsas y la compra mínima es 1 pack. Los rollos y cajas muestran su cantidad exacta de bolsas en la descripción del producto.'
          nuevo = 'Los rollos de bolsas, packs y cajas muestran la cantidad exacta en la descripción de cada producto.'

          if anterior not in text:
              raise SystemExit('No se encontró el texto anterior de la FAQ.')

          text = text.replace(anterior, nuevo, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Guardar cambio
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hubo cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplifica respuesta sobre cantidad de bolsas"
          git push
