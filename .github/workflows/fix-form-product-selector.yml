name: Fix selector de productos del formulario

on:
  push:
    paths:
      - '.github/workflows/fix-form-product-selector.yml'

permissions:
  contents: write

jobs:
  fix-selector:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Separar filtro del formulario
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          anterior = '    const listaFiltrada = productosFiltrados();'
          nuevo = '    const listaFiltrada = productos;'

          if anterior not in text:
              raise SystemExit('No se encontró el selector de productos esperado.')

          text = text.replace(anterior, nuevo, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Guardar cambio y retirar workflow temporal
        shell: bash
        run: |
          rm -f .github/workflows/fix-form-product-selector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js .github/workflows/fix-form-product-selector.yml
          git commit -m "Separa filtro de categoria del formulario"
          git push
