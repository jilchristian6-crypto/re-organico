name: Cambiar enlace Blog

on:
  push:
    branches:
      - cambiar-nav-nuestro-blog

permissions:
  contents: write

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar navegación
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<li><a href="#trabajo">En Tu Trabajo</a></li>'
          new = '<li><a href="#impacto">Nuestro Blog</a></li>'
          if old not in s:
              raise SystemExit('No se encontró el enlace de navegación esperado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Cambiar navegación a Nuestro Blog"
          git push
